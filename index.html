<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/searchpanes/2.1.2/css/searchPanes.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/select/1.7.0/css/select.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/fixedheader/3.3.2/css/fixedHeader.dataTables.min.css">
    

    <style> @import "./src/style.css";</style>
  </head>
  <body>

<!-- Sticky Header and Search Bar -->
<div id="header-container">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background: white; border-bottom: 1px solid #ccc;">
    <!-- Device Counts Header -->
    <div id="device-header" style="font-size: 1.2em;">
      <span id="total-count" class="header-item active" style="cursor: pointer;">Total Devices: 0</span> |
      <span id="windows-count" class="header-item" style="cursor: pointer;">Windows: 0</span> |
      <span id="macos-count" class="header-item" style="cursor: pointer;">macOS: 0</span> |
      <span id="ios-count" class="header-item" style="cursor: pointer;">iOS: 0</span> |
      <span id="other-count" class="header-item" style="cursor: pointer;">Other: 0</span>
    </div>

    <!-- Custom Search Bar -->
    <div id="custom-search-container">
      <input
        type="text"
        id="custom-search"
        placeholder="Search..."
        style="padding: 5px; font-size: 1em; width: 200px;"
      />
    </div>
  </div>
</div>

    

<!-- DataTable -->
    <table id="table" class="display nowrap" style="width:100%"></table>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>
    <script src="https://cdn.datatables.net/fixedheader/3.3.2/js/dataTables.fixedHeader.min.js"></script>
    <script src="https://cdn.datatables.net/searchpanes/2.1.2/js/dataTables.searchPanes.min.js"></script>
    <script src="https://cdn.datatables.net/select/1.7.0/js/dataTables.select.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    

    <script type="module">
      import "./src/index.js";
    </script>
  </body>
</html>
